<?xml version="1.0" encoding="UTF-8"?>
<!-- MakerBridge MB monogram transparent -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 840 480"
     width="840"
     height="480"
     role="img"
     aria-label="MakerBridge logo">
  <title>MakerBridge</title>
  <defs>
    <linearGradient id="gMain" x1="50" y1="30" x2="790" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8AEAFF"/>
      <stop offset="25%" stop-color="#4FC0FF"/>
      <stop offset="55%" stop-color="#2F78FF"/>
      <stop offset="100%" stop-color="#1848E0"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="40" y1="40" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8F2FF"/>
      <stop offset="45%" stop-color="#58C8FF"/>
      <stop offset="100%" stop-color="#2F88F5"/>
    </linearGradient>
    <linearGradient id="gDeep" x1="360" y1="60" x2="800" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3A90FF"/>
      <stop offset="50%" stop-color="#2160E8"/>
      <stop offset="100%" stop-color="#1438C0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.2" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="fold" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-2" dy="6" stdDeviation="2.6" flood-color="#030d22" flood-opacity="0.75"/>
    </filter>
  </defs>
  <g id="logo" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="76">
    <path filter="url(#shadow)" stroke="url(#gDeep)"
          d="M 500 110 L 520 365 C 520 412 555 438 608 438 C 680 438 724 392 724 330 C 724 272 680 238 608 238 L 530 238"/>
    <path filter="url(#shadow)" stroke="url(#gMain)"
          d="M 90 375 L 215 95 L 340 355 L 465 95 L 500 110"/>
    <path filter="url(#fold)" stroke="url(#gMain)"
          d="M 500 110 C 500 58 540 36 595 36 C 670 36 724 88 724 155 C 724 218 675 250 610 250 L 455 250"/>
    <path stroke="url(#gCyan)" d="M 90 375 L 215 95"/>
  </g>
</svg>
